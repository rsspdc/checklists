stages:
  - swh-save

swh-save:
  stage: swh-save
  image: alpine:latest
  rules:
    - if $CI_COMMIT_TAG =~ /^v?[0-9]+\.[0-9]+/
  script: >
    apk add --no-cache curl
    echo "Saving $CI_PROJECT_URL to Software Heritage"
    result=$(curl -X POST https://archive.softwareheritage.org/api/1/origin/save/git/url/${CI_PROJECT_URL}/)
    # In this version, the result var isn't used further
    echo "Save request sent to the Software Heritage API."
    echo "To check for the progress of the save process, go to https://archive.softwareheritage.org/save/#requests ."
